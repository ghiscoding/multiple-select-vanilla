packages:
  - 'packages/**'

allowBuilds:
  '@parcel/watcher': false
  esbuild: false

# Define a catalog of version ranges.
catalog:
  cross-env: ^10.1.0
  native-copyfiles: ^2.0.3
  remove-glob: ^1.2.2
  sass: ^1.102.0
  typescript: ^7.0.2

minimumReleaseAge: 2880 # 2 days in minutes

minimumReleaseAgeExclude:
  # exclude packages that I personally maintain and are safe to use on the same day
  - '@lerna-lite/*'
  # Renovate security update: ip-address@10.5.1
  - ip-address@10.5.1
  # Renovate security update: undici@7.30.0
  - undici@7.30.0

overrides:
  ip-address: ^10.5.1
  undici: ^7.30.0
