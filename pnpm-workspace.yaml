packages:
  - 'packages/**'

allowBuilds:
  '@parcel/watcher': false
  esbuild: false

# Define a catalog of version ranges.
catalog:
  cross-env: ^10.1.0
  native-copyfiles: ^2.1.1
  remove-glob: ^1.2.3
  sass: ^1.105.1
  typescript: ^7.0.2

minimumReleaseAge: 2880 # 2 days in minutes

minimumReleaseAgeExclude:
  # exclude packages that I personally maintain and are safe to use on the same day
  - '@lerna-lite/*'
  - native-copyfiles

overrides:
  ip-address: ^10.7.3
  svgo: ^4.1.0
  undici: ^8.11.2
